    # ========================================
# 🎉 ROUTES DES ÉVÉNEMENTS (À AJOUTER)
# ========================================

# Liste des événements (accessible à tous)
app_event_index:
    path: /event
    controller: App\Controller\EventController::index
    methods: [GET]

# Créer un nouvel événement (responsables uniquement)
app_event_new:
    path: /event/new
    controller: App\Controller\EventController::new
    methods: [GET, POST]

# Modifier un événement (responsables uniquement)
app_event_edit:
    path: /event/{id}/edit
    controller: App\Controller\EventController::edit
    methods: [GET, POST]
    requirements:
        id: '\d+'

# Supprimer un événement (responsables uniquement)
app_event_delete:
    path: /event/{id}/delete
    controller: App\Controller\EventController::delete
    methods: [GET]
    requirements:
        id: '\d+'

